name: Build Executable

on:
  push:
    paths:
      - "Get-EndOfLife-GUI.ps1"
      - "compile.ps1"
      - ".github/workflows/build-executable.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ps2exe
        shell: pwsh
        run: |
          Install-Module -Name ps2exe -Scope CurrentUser -Force

      - name: Compile PowerShell script
        shell: pwsh
        run: |
          ./compile.ps1

      - name: Upload compiled executable
        uses: actions/upload-artifact@v4
        with:
          name: compiled-executable
          path: ./dist/
